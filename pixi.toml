[workspace]
channels = ["conda-forge"]
name = "solix-hackathon-2026"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
test-connection = "python test_connection.py"
test-preprocess = "python -m unittest tests/test_preprocess.py"
test-demo = "python -m unittest tests/test_demo_video.py"
test = "python -m unittest discover tests"
preprocess = "python -m src.preprocess"

[dependencies]
python = ">=3.15.2,<3.16"
openai = ">=3.40.0,<4"
python-dotenv = ">=1.2.4,<2"
pillow = ">=13.0.0,<14"
pydantic = ">=2.14.1,<3"
numpy = ">=2.5.4,<3"
