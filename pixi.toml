[workspace]
channels = ["conda-forge"]
name = "solix-hackathon-2026"
platforms = ["win-64"]
version = "0.1.0"

[environments]
default = []
cuda = { features = ["cuda"], no-default-feature = true }

[feature.cuda]
channels = ["conda-forge"]
platforms = ["win-64"]

[feature.cuda.dependencies]
python = "3.11.*"
pytorch = "2.11.0"
numpy = "*"
pydantic = ">=2.0"
matplotlib = "*"

[feature.cuda.tasks]
test-cuda = "python -c \"import torch; print('PyTorch:', torch.__version__, 'CUDA available:', torch.cuda.is_available())\""

[tasks]
test-connection = "python test_connection.py"
test-preprocess = "python -m unittest tests/test_preprocess.py"
test-demo = "python -m unittest tests/test_demo_video.py"
test-clustering = "python -m unittest tests/test_boundary_clustering.py"
test = "python -m unittest discover tests"
preprocess = "python -m src.preprocess"
plot = "python src/plot_derivatives.py"
stitch-workflows = "python -m src.workflow_stitcher"
synthesize = "python -m src.tier2_synthesis"
generate-automations = "python -m src.automation_generator"
dashboard = "python -m src.dashboard_generator"
serve = "python -m src.web.app --port 8000"
test-automations = "python -m unittest tests/test_phase5_automations.py"
pipeline = "python -m src.main"

[dependencies]
python = ">=3.15.2,<3.16"
openai = ">=3.40.0,<4"
python-dotenv = ">=1.2.4,<2"
pillow = ">=13.0.0,<14"
pydantic = ">=2.14.1,<3"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"
tiktoken = ">=0.14.0,<0.15"
